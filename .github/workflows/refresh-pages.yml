name: Refresh catalog and deploy Pages

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/refresh_catalog.py'
      - '.github/workflows/refresh-pages.yml'

concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Refresh model catalog
        run: |
          mkdir site
          cp docs/index.html docs/dashboard.css docs/calculator.py docs/.nojekyll site/
          python3 scripts/refresh_catalog.py site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed catalog
        id: deployment
        uses: actions/deploy-pages@v4
